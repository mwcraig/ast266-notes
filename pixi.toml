[workspace]
authors = ["Matt Craig <mattwcraig@gmail.com>"]
channels = ["conda-forge"]
name = "ast266-notes"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]
lab = "jupyter lab"

# Only python comes from conda-forge; everything else is pinned to the
# versions installed with pip on the course JupyterHub server (TLJH, linux-64).
[dependencies]
python = "3.12.*"
pip = "*"
# NOTE: a few packages (aggdraw, ultranest, ...) have no macOS wheels and are
# built from source. That build fails if the environment prefix contains spaces
# (this repo's path does), so use detached environments. Either per-project
# (writes .pixi/config.toml, which syncs via Dropbox but is not tracked by git):
#     pixi config set --local detached-environments true
# or for every project on this machine:
#     pixi config set --global detached-environments true
# This is a pixi *config* setting, so it cannot be put in this manifest. After
# enabling it, delete any half-built .pixi/envs and rerun `pixi run lab`.
# pyproj additionally needs the PROJ C library to build, so take it (and its
# python dep certifi, pinned to the server's version) from conda-forge instead.
pyproj = "3.7.2.*"
certifi = "2026.5.20.*"

